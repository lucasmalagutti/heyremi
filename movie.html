<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>HeyRemi</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand link-light" href="index.html">HeyRemi</a>
        </div>
    </nav>

    <h1>Reviews for:</h1>
    <h3 id="title">Movie Title</h3>

    <div class="container-fluid mb-4">
        <div class="card text-bg-dark p-2 review-form-card">
            <div class="card-body">
                <h5 class="card-title">Add review</h5>
                <form id="reviewForm">
                    <label class="form-label" for="reviewUser">User</label>
                    <input class="form-control mb-3" type="text" id="reviewUser" required>
                    <label class="form-label" for="reviewText">Review</label>
                    <textarea class="form-control mb-3" id="reviewText" rows="3" required></textarea>
                    <button class="btn btn-secondary" type="submit">Publish review</button>
                </form>
                <p id="reviewFormMessage" class="mt-3 mb-0" role="status"></p>
            </div>
        </div>
    </div>

    <section id="section">

    </section>

</body>
<script src="js/movie.js"></script>

</html>
